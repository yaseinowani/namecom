<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Luxury Slate -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#020617" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="45%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Top Highlight -->
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Drop shadow for the character -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#f59e0b" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Base Rounded Icon Container -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="16" />
  
  <!-- Subtle Top Gloss Arc -->
  <rect x="28" y="28" width="456" height="220" rx="104" fill="url(#shineGrad)" />

  <!-- Four Corner Accent Marks -->
  <circle cx="84" cy="84" r="8" fill="#fbbf24" opacity="0.7"/>
  <circle cx="428" cy="84" r="8" fill="#fbbf24" opacity="0.7"/>
  <circle cx="84" cy="428" r="8" fill="#fbbf24" opacity="0.7"/>
  <circle cx="428" cy="428" r="8" fill="#fbbf24" opacity="0.7"/>

  <!-- Main Kanji: 「名」 in Gold -->
  <text 
    x="50%" 
    y="55%" 
    dominant-baseline="central" 
    text-anchor="middle" 
    font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif" 
    font-weight="900" 
    font-size="285" 
    fill="url(#goldGrad)" 
    filter="url(#shadow)">
    名
  </text>
</svg>
